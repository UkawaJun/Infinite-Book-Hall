<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>无限图书回廊</title></head><body>
<header><button id="music-toggle" title="音乐设置">♫</button><strong>无限图书回廊 <small></small></strong><nav><button id="home">大厅</button><button id="back">返回</button><button id="refresh">刷新</button><button id="toggle-basket" aria-controls="selection-panel" aria-expanded="true">收起收纳筐</button><button id="settings">管理入口 / 路径</button></nav></header>
<section class="heading"><div><span>YOUR PERSONAL COLLECTION</span><h1 id="title">正在打开图书馆…</h1></div><p id="hint"></p></section>
<main><article id="scene"></article><aside id="detail"><div class="empty">选择一本书<br><small>在这里查看封面与详细信息</small></div></aside></main>
<footer id="selection-panel"><div><label>拖动书籍到这里收纳</label><small id="count">收纳筐 · 0 本</small><button id="putdown" disabled title="把选书框中的文件移动到当前房间">放下到当前房间</button><button id="clear">清空收纳筐</button></div><div id="basket"></div></footer>
<dialog id="config"><h2>我的书室入口</h2><p>路径保存在程序旁的 personal.json。不存在的路径会显示为维护中。</p><div id="rows"></div><button id="add">＋ 添加入口</button><div class="actions"><button id="cancel">取消</button><button id="save">保存设置</button></div></dialog><div id="toast"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script><script src="wood.js"></script><script src="marble.js"></script><script src="rename.js"></script><script src="view.js"></script><script src="app.js"></script><script src="settings.js"></script><script src="music.js"></script><script src="reading.js"></script><script src="search.js"></script><script src="usage.js"></script></body></html>
